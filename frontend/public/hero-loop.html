<html lang="en">

html,body,#root{height:100%;background:#0a0a0a}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

</head>
<body>
<div id="root"></div>
<script type="text/babel">
// ─── EASING ──────────────────────────────────────────────────────
const Easing = {
  linear: t => t,
  easeInQuad:    t => t*t,
  easeOutQuad:   t => t*(2-t),
  easeInOutQuad: t => t<0.5?2*t*t:-1+(4-2*t)*t,
  easeInCubic:   t => t*t*t,
  easeOutCubic:  t => (--t)*t*t+1,
  easeInOutCubic:t => t<0.5?4*t*t*t:(t-1)*(2*t-2)*(2*t-2)+1,
  easeInQuart:   t => t*t*t*t,
  easeOutQuart:  t => 1-(--t)*t*t*t,
  easeOutExpo:   t => t===1?1:1-Math.pow(2,-10*t),
  easeOutSine:   t => Math.sin((t*Math.PI)/2),
  easeOutBack: t => { const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); },
  easeInBack:  t => { const c1=1.70158,c3=c1+1; return c3*t*t*t-c1*t*t; },
  easeOutElastic: t => {
    const c4=(2*Math.PI)/3;
    if(t===0)return 0; if(t===1)return 1;
    return Math.pow(2,-10*t)*Math.sin((t*10-0.75)*c4)+1;
  },
};

const clamp = (v,min,max) => Math.max(min,Math.min(max,v));

function animate({from=0,to=1,start=0,end=1,ease=Easing.easeInOutCubic}){
  return t => {
    if(t<=start)return from; if(t>=end)return to;
    return from+(to-from)*ease((t-start)/(end-start));
  };
}

// ─── TIMELINE ────────────────────────────────────────────────────
const TimelineCtx = React.createContext({time:0,duration:34});
const useTime = () => React.useContext(TimelineCtx).time;
const useTimeline = () => React.useContext(TimelineCtx);

const SpriteCtx = React.createContext({localTime:0,progress:0,duration:0,visible:true});
const useSprite = () => React.useContext(SpriteCtx);

function Sprite({start=0,end=Infinity,children,keepMounted=false}){
  const {time} = useTimeline();
  const visible = time>=start && time<=end;
  if(!visible && !keepMounted)return null;
  const dur = end-start;
  const lt = Math.max(0,time-start);
  const prog = dur>0&&isFinite(dur)?clamp(lt/dur,0,1):0;
  const val = {localTime:lt,progress:prog,duration:dur,visible};
  return (
    <SpriteCtx.Provider value={val}>
      {typeof children==='function'?children(val):children}
    </SpriteCtx.Provider>
  );
}

// ─── PALETTE & FONTS ─────────────────────────────────────────────
const D = {
  bg:'#140b06', bgDeep:'#0b0603', bgWarm:'#1d1108',
  cream:'#f4e4c1', creamDim:'#b9a382', muted:'#7a6a51',
  saffron:'#e87722', saffronLight:'#ff8e35',
  gold:'#f6c768', goldMid:'#c08a3a', goldDeep:'#5a3e18',
  green:'#7ec98a', red:'#e26d5a', paper:'#e8d8b0',
  paperShadow:'#b59a64', ink:'#3a2410',
  serif:"'Tiro Devanagari Hindi','Fraunces',Georgia,serif",
  sans:"'Plus Jakarta Sans',system-ui,sans-serif",
  mono:"'IBM Plex Mono',ui-monospace,monospace",
};

// ─── STAGE ───────────────────────────────────────────────────────
function Stage({width=1920,height=1080,duration=34,background='#140b06',loop=true,persistKey='dk-hero',children}){
  const [time,setTime] = React.useState(()=>{
    try{ const v=parseFloat(localStorage.getItem(persistKey+':t')||'0'); return isFinite(v)?clamp(v,0,duration):0; }
    catch{return 0;}
  });
  const [playing,setPlaying] = React.useState(true);
  const [hoverTime,setHoverTime] = React.useState(null);
  const [scale,setScale] = React.useState(1);
  const stageRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  React.useEffect(()=>{
    try{localStorage.setItem(persistKey+':t',String(time));}catch{}
  },[time,persistKey]);

  React.useEffect(()=>{
    if(!stageRef.current)return;
    const el=stageRef.current;
    const measure=()=>{
      const barH=48;
      const s=Math.min(el.clientWidth/width,(el.clientHeight-barH)/height);
      setScale(Math.max(0.05,s));
    };
    measure();
    const ro=new ResizeObserver(measure);
    ro.observe(el); window.addEventListener('resize',measure);
    return ()=>{ro.disconnect();window.removeEventListener('resize',measure);};
  },[width,height]);

  React.useEffect(()=>{
    if(!playing){lastTsRef.current=null;return;}
    const step=ts=>{
      if(lastTsRef.current==null)lastTsRef.current=ts;
      const dt=(ts-lastTsRef.current)/1000; lastTsRef.current=ts;
      setTime(t=>{
        let next=t+dt;
        if(next>=duration){if(loop)next=next%duration;else{next=duration;setPlaying(false);}}
        return next;
      });
      rafRef.current=requestAnimationFrame(step);
    };
    rafRef.current=requestAnimationFrame(step);
    return ()=>{if(rafRef.current)cancelAnimationFrame(rafRef.current);lastTsRef.current=null;};
  },[playing,duration,loop]);

  React.useEffect(()=>{
    const onKey=e=>{
      if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
      if(e.code==='Space'){e.preventDefault();setPlaying(p=>!p);}
      else if(e.code==='ArrowLeft')setTime(t=>clamp(t-(e.shiftKey?1:0.1),0,duration));
      else if(e.code==='ArrowRight')setTime(t=>clamp(t+(e.shiftKey?1:0.1),0,duration));
      else if(e.key==='0'||e.code==='Home')setTime(0);
    };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[duration]);

  const displayTime = hoverTime!=null?hoverTime:time;
  const ctx = React.useMemo(()=>({time:displayTime,duration,playing,setTime,setPlaying}),[displayTime,duration,playing]);

  return (
    <div ref={stageRef} style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',background:'#0a0a0a',fontFamily:D.sans}}>
      <div style={{flex:1,width:'100%',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',minHeight:0}}>
        <div style={{width,height,background,position:'relative',transform:`scale(${scale})`,transformOrigin:'center',flexShrink:0,boxShadow:'0 20px 60px rgba(0,0,0,0.5)',overflow:'hidden'}}>
          <TimelineCtx.Provider value={ctx}>
            {children}
          </TimelineCtx.Provider>
        </div>
      </div>
      <PlaybackBar time={displayTime} duration={duration} playing={playing}
        onPlayPause={()=>setPlaying(p=>!p)}
        onReset={()=>setTime(0)}
        onSeek={t=>setTime(t)}
        onHover={t=>setHoverTime(t)}
      />
    </div>
  );
}

function PlaybackBar({time,duration,playing,onPlayPause,onReset,onSeek,onHover}){
  const trackRef=React.useRef(null);
  const [dragging,setDragging]=React.useState(false);
  const timeFrom=React.useCallback(e=>{
    const r=trackRef.current.getBoundingClientRect();
    return clamp((e.clientX-r.left)/r.width,0,1)*duration;
  },[duration]);
  const onMove=e=>{ if(!trackRef.current)return; if(dragging)onSeek(timeFrom(e)); else onHover(timeFrom(e)); };
  const onLeave=()=>{ if(!dragging)onHover(null); };
  const onDown=e=>{ setDragging(true); onSeek(timeFrom(e)); onHover(null); };
  React.useEffect(()=>{
    if(!dragging)return;
    const up=()=>setDragging(false);
    const mv=e=>{ if(!trackRef.current)return; onSeek(timeFrom(e)); };
    window.addEventListener('mouseup',up); window.addEventListener('mousemove',mv);
    return ()=>{ window.removeEventListener('mouseup',up); window.removeEventListener('mousemove',mv); };
  },[dragging,timeFrom,onSeek]);
  const pct=duration>0?(time/duration)*100:0;
  const fmt=t=>{ const m=Math.floor(t/60),s=Math.floor(t%60),cs=Math.floor((t*100)%100);
    return `${m}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`; };
  return (
    <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 16px',background:'rgba(18,10,4,0.96)',borderTop:'1px solid rgba(244,228,193,0.08)',width:'100%',maxWidth:700,alignSelf:'center',borderRadius:8,color:D.cream,userSelect:'none',flexShrink:0}}>
      <Btn onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/></svg>
      </Btn>
      <Btn onClick={onPlayPause} title="Play/pause (Space)">
        {playing
          ? <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/></svg>
          : <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 2l9 5-9 5V2z" fill="currentColor"/></svg>
        }
      </Btn>
      <div style={{fontFamily:D.mono,fontSize:12,width:64,textAlign:'right',fontVariantNumeric:'tabular-nums'}}>{fmt(time)}</div>
      {/* Scene labels */}
      <div ref={trackRef} onMouseMove={onMove} onMouseLeave={onLeave} onMouseDown={onDown}
        style={{flex:1,height:22,position:'relative',cursor:'pointer',display:'flex',alignItems:'center'}}>
        <div style={{position:'absolute',left:0,right:0,height:4,background:'rgba(244,228,193,0.10)',borderRadius:2}}/>
        {/* Scene markers */}
        {[[7/34,''], [10/34,''], [15/34,''], [20/34,''], [25.5/34,''], [28/34,''], [32/34,'']].map(([p],i)=>(
          <div key={i} style={{position:'absolute',left:`${p*100}%`,top:'50%',width:2,height:10,marginTop:-5,background:'rgba(232,119,34,0.5)',borderRadius:1}}/>
        ))}
        <div style={{position:'absolute',left:0,width:`${pct}%`,height:4,background:D.saffron,borderRadius:2}}/>
        <div style={{position:'absolute',left:`${pct}%`,top:'50%',width:12,height:12,marginLeft:-6,marginTop:-6,background:'#fff',borderRadius:6,boxShadow:'0 2px 6px rgba(0,0,0,0.5)'}}/>
      </div>
      <div style={{fontFamily:D.mono,fontSize:12,width:64,color:'rgba(244,228,193,0.4)',fontVariantNumeric:'tabular-nums'}}>{fmt(duration)}</div>
    </div>
  );
}

function Btn({children,onClick,title}){
  const [h,setH]=React.useState(false);
  return <button onClick={onClick} title={title} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
    style={{width:28,height:28,display:'flex',alignItems:'center',justifyContent:'center',background:h?'rgba(244,228,193,0.12)':'rgba(244,228,193,0.04)',border:'1px solid rgba(244,228,193,0.1)',borderRadius:6,color:D.cream,cursor:'pointer',padding:0,transition:'background 120ms'}}>{children}</button>;
}

// ─── SHARED COMPONENTS ───────────────────────────────────────────
function StageBackground(){
  const t=useTime();
  const gx=50+Math.sin(t*0.25)*6, gy=45+Math.cos(t*0.2)*4;
  return (
    <div style={{position:'absolute',inset:0,background:`radial-gradient(ellipse 70% 55% at ${gx}% ${gy}%,rgba(232,119,34,0.08),transparent 60%),radial-gradient(ellipse 90% 70% at 50% 110%,rgba(90,62,24,0.18),transparent 60%),${D.bg}`,pointerEvents:'none'}}>
      <div style={{position:'absolute',inset:0,backgroundImage:'radial-gradient(rgba(255,210,140,0.03) 1px,transparent 1px)',backgroundSize:'3px 3px',mixBlendMode:'screen',opacity:0.6}}/>
    </div>
  );
}

function Vignette(){
  return <div style={{position:'absolute',inset:0,pointerEvents:'none',background:'radial-gradient(ellipse 100% 80% at 50% 50%,transparent 55%,rgba(0,0,0,0.45) 100%)',zIndex:999}}/>;
}

function FadeOverlay(){
  const t=useTime(), dur=useTimeline().duration;
  let a=0;
  if(t<0.5)a=1-t/0.5;
  else if(t>dur-0.5)a=(t-(dur-0.5))/0.5;
  if(a<=0)return null;
  return <div style={{position:'absolute',inset:0,pointerEvents:'none',background:'#000',opacity:clamp(a,0,1),zIndex:1000}}/>;
}

function Caption({hi,en,x=960,y=940,align='center',accent=D.saffron}){
  const tx=align==='center'?'-50%':align==='right'?'-100%':'0';
  return (
    <div style={{position:'absolute',left:x,top:y,transform:`translateX(${tx})`,textAlign:align,color:D.cream,width:1400}}>
      {hi&&<div style={{fontFamily:D.serif,fontSize:56,lineHeight:1.05,color:D.cream,letterSpacing:'-0.5px'}}>{hi}</div>}
      {en&&<div style={{fontFamily:D.mono,fontSize:14,marginTop:14,letterSpacing:'0.22em',textTransform:'uppercase',color:accent,fontWeight:500}}>{en}</div>}
    </div>
  );
}

function Chip({children,color=D.saffron,bg,dot=false,style={}}){
  return (
    <div style={{display:'inline-flex',alignItems:'center',gap:8,padding:'6px 12px',borderRadius:999,background:bg||'rgba(232,119,34,0.12)',border:'1px solid rgba(232,119,34,0.32)',color,fontFamily:D.mono,fontSize:11,fontWeight:600,letterSpacing:'0.10em',textTransform:'uppercase',whiteSpace:'nowrap',...style}}>
      {dot&&<div style={{width:6,height:6,borderRadius:999,background:color,boxShadow:`0 0 10px ${color}`}}/>}
      {children}
    </div>
  );
}

function PhoneFrame({x=760,y=100,width=400,height=820,scale=1,rotate=0,glow=true,children}){
  const si=14;
  return (
    <div style={{position:'absolute',left:x,top:y,width,height,transform:`scale(${scale}) rotate(${rotate}deg)`,transformOrigin:'center'}}>
      {glow&&<div style={{position:'absolute',inset:-60,background:'radial-gradient(ellipse 60% 50% at 50% 50%,rgba(255,142,53,0.22),transparent 60%)',filter:'blur(20px)',pointerEvents:'none'}}/>}
      <div style={{position:'absolute',inset:0,borderRadius:56,background:'linear-gradient(160deg,#2a1c10,#100802 70%)',boxShadow:`0 60px 120px rgba(0,0,0,0.6),0 0 0 1.5px rgba(244,228,193,0.08),inset 0 1px 0 rgba(244,228,193,0.10)`}}>
        <div style={{position:'absolute',left:-3,top:180,width:4,height:70,borderRadius:2,background:'#2a1c10'}}/>
        <div style={{position:'absolute',right:-3,top:220,width:4,height:100,borderRadius:2,background:'#2a1c10'}}/>
        <div style={{position:'absolute',left:si,top:si,right:si,bottom:si,borderRadius:44,background:D.bg,overflow:'hidden'}}>
          {/* Status bar */}
          <div style={{position:'absolute',top:0,left:0,right:0,height:36,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 28px',zIndex:10,fontFamily:D.sans,fontSize:13,fontWeight:600,color:D.cream}}>
            <div>9:41</div>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <div style={{display:'flex',alignItems:'flex-end',gap:2}}>{[3,5,7,9].map(h=><div key={h} style={{width:3,height:h,background:D.cream,borderRadius:1}}/>)}</div>
              <div style={{width:22,height:11,borderRadius:3,border:`1px solid ${D.cream}`,position:'relative',padding:1}}><div style={{width:'78%',height:'100%',background:D.cream,borderRadius:1}}/></div>
            </div>
          </div>
          <div style={{position:'absolute',top:8,left:'50%',transform:'translateX(-50%)',width:110,height:30,borderRadius:20,background:'#000',zIndex:11}}/>
          <div style={{position:'absolute',inset:0,paddingTop:36}}>{children}</div>
        </div>
      </div>
    </div>
  );
}

function CountUp({from,to,t}){
  return Math.round(from+(to-from)*Easing.easeOutCubic(t)).toLocaleString('en-IN');
}

function Row({label,value,big=false,muted=false}){
  return (
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginTop:big?4:0}}>
      <div style={{fontFamily:D.mono,fontSize:big?13:11,color:muted?D.muted:D.creamDim,letterSpacing:'0.15em',textTransform:'uppercase'}}>{label}</div>
      <div style={{fontFamily:D.serif,fontSize:big?30:16,color:big?D.saffron:D.cream,fontWeight:big?700:500}}>{value}</div>
    </div>
  );
}

// ─── SCENE 1: PROBLEM (0–7.2s) ───────────────────────────────────
function PaperLedger({progress}){
  const sc=0.92+progress*0.10, rot=-2.5+Math.sin(progress*2)*0.4;
  return (
    <div style={{position:'absolute',left:320,top:80,width:1280,height:940,transform:`scale(${sc}) rotate(${rot}deg)`,transformOrigin:'50% 60%'}}>
      <div style={{position:'absolute',inset:'24px -16px -28px 18px',background:'#d4be8d',borderRadius:4,boxShadow:'0 30px 60px rgba(0,0,0,0.55)',transform:'rotate(1.6deg)'}}/>
      <div style={{position:'absolute',inset:'12px 22px -16px -22px',background:'#decb9f',borderRadius:4,boxShadow:'0 24px 50px rgba(0,0,0,0.45)',transform:'rotate(-1deg)'}}/>
      <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse at 30% 20%,#f3e4be 0%,#e8d8b0 40%,#cdb784 100%)',borderRadius:4,boxShadow:'0 30px 80px rgba(0,0,0,0.6),inset 0 0 90px rgba(120,85,40,0.22)',overflow:'hidden'}}>
        {[...Array(18)].map((_,i)=><div key={i} style={{position:'absolute',left:60,right:60,top:110+i*44,height:1,background:'rgba(90,62,24,0.18)'}}/>)}
        <div style={{position:'absolute',left:60,right:60,top:100,bottom:60,borderLeft:'1px solid rgba(160,40,30,0.35)',borderRight:'1px solid rgba(160,40,30,0.35)'}}/>
        <div style={{position:'absolute',left:60,right:60,top:50,height:50,borderBottom:'2px solid rgba(160,40,30,0.6)',display:'flex',alignItems:'flex-end',fontFamily:`'Tiro Devanagari Hindi',serif`,fontSize:28,color:'#7a2418',fontStyle:'italic',paddingBottom:6}}>
          बही‑खाता &nbsp;<span style={{fontSize:16,color:'#5a3e18',opacity:0.7}}>— सोमवार</span>
        </div>
        <div style={{position:'absolute',right:80,top:200,width:180,height:180,background:'radial-gradient(circle,rgba(120,70,30,0.35),transparent 70%)',borderRadius:'50%'}}/>
        <div style={{position:'absolute',left:200,bottom:110,width:120,height:120,background:'radial-gradient(circle,rgba(80,40,20,0.28),transparent 70%)',borderRadius:'50%'}}/>
        {[0.18,0.5,0.82].map((p,i)=><div key={i} style={{position:'absolute',left:24,top:`${p*100}%`,width:16,height:16,borderRadius:'50%',background:'rgba(40,20,10,0.22)'}}/>)}
      </div>
    </div>
  );
}

function ScribbleLine({start,hi,en,amount,top,status='ok',appearance='ink'}){
  const {localTime}=useSprite();
  const local=localTime-start;
  if(local<0)return null;
  const t=Math.min(1,local/0.35);
  const inkColor=appearance==='red'?'#7a2418':'#3a2410';
  const strikeP=clamp((local-0.6)/0.4,0,1);
  return (
    <div style={{position:'absolute',left:0,right:0,top,transform:`translateX(${(1-t)*-10}px)`,opacity:t,fontFamily:"'Caveat',cursive",fontSize:22,color:inkColor,fontStyle:'italic',display:'flex',alignItems:'baseline',gap:18,paddingLeft:96,paddingRight:96,pointerEvents:'none'}}>
      <div style={{fontFamily:`'Tiro Devanagari Hindi',serif`,fontSize:26,minWidth:220}}>{hi}</div>
      <div style={{flex:1,fontFamily:"'Caveat',cursive",fontSize:24,color:'#5a3e18',transform:`rotate(${-1+Math.sin(start*12)*1.5}deg)`}}>{en}</div>
      <div style={{fontFamily:`'Tiro Devanagari Hindi',serif`,fontSize:26,minWidth:140,textAlign:'right'}}>{amount}</div>
      {status==='strike'&&<div style={{position:'absolute',left:96+220,right:96+140,top:18,height:2,background:'#7a2418',transform:`scaleX(${strikeP})`,transformOrigin:'left',opacity:0.9,borderRadius:2}}/>}
      {status==='question'&&<div style={{position:'absolute',right:96+80,top:-4,fontFamily:"'Caveat',cursive",color:'#7a2418',fontSize:34,fontWeight:700,transform:`rotate(8deg) scale(${0.6+strikeP*0.6})`,opacity:strikeP}}>??</div>}
    </div>
  );
}

function UdhaarSlip({start,x,y,rotate,who,amount}){
  const {localTime}=useSprite();
  const local=localTime-start;
  if(local<0)return null;
  const t=clamp(local/0.4,0,1), eased=Easing.easeOutBack(t);
  const sc=0.4+0.6*eased;
  const wobble=local>0.4?Math.sin((local-0.4)*18)*(Math.max(0,0.25-(local-0.4))/0.25)*1.5:0;
  return (
    <div style={{position:'absolute',left:x,top:y,width:240,height:130,padding:16,transform:`scale(${sc}) rotate(${rotate+wobble}deg)`,transformOrigin:'center',background:'#f5e8c4',boxShadow:'0 18px 28px rgba(0,0,0,0.45),0 0 0 1px rgba(120,80,30,0.25)',opacity:t,fontFamily:"'Caveat',cursive",color:'#3a2410'}}>
      <div style={{fontFamily:`'Tiro Devanagari Hindi',serif`,fontSize:13,color:'#8a5a20',letterSpacing:'0.2em',textTransform:'uppercase'}}>उधार</div>

function ShopAmbient({localTime}){
  return (
    <div style={{position:'absolute',inset:0,background:`radial-gradient(ellipse 90% 50% at 50% 70%,rgba(232,119,34,0.10),transparent 60%),radial-gradient(ellipse 50% 30% at 20% 20%,rgba(192,138,58,0.08),transparent 60%),radial-gradient(ellipse 50% 30% at 80% 20%,rgba(192,138,58,0.08),transparent 60%)`,pointerEvents:'none'}}>
      {[...Array(18)].map((_,i)=>{
        const x=80+(i*137)%1760, y=60+(i*211)%960+Math.sin(localTime+i)*8;
        const op=0.15+Math.sin(localTime*0.15*Math.PI*2+i)*0.1;
        return <div key={i} style={{position:'absolute',left:x,top:y,width:4,height:4,borderRadius:'50%',background:D.saffronLight,opacity:Math.max(0,op),boxShadow:`0 0 14px ${D.saffronLight}`}}/>;
      })}
    </div>
  );
}

function DashboardScreen({localTime}){
  const heroT=clamp(localTime/0.6,0,1), sparkT=clamp((localTime-0.4)/1.5,0,1);
  const points=[];
  for(let i=0;i<30;i++){
    const x=(i/29)*320, base=50+Math.sin(i*0.5)*8, trend=(i/29)*-30, noise=Math.sin(i*1.7)*5;
    points.push([x,base+trend+noise]);
  }
  const vp=points.slice(0,Math.floor(sparkT*30));
  const d=vp.map((p,i)=>(i===0?`M${p[0]},${p[1]}`:`L${p[0]},${p[1]}`)).join(' ');
  const last=vp[vp.length-1];
  return (
    <div style={{position:'absolute',inset:0,padding:'20px 18px',display:'flex',flexDirection:'column'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:6}}>
        <div style={{fontFamily:D.serif,fontSize:18,color:D.cream}}>नमस्ते, रवि जी</div>
        <div style={{padding:'3px 8px',borderRadius:999,background:'rgba(126,201,138,0.18)',border:'1px solid rgba(126,201,138,0.4)',color:D.green,fontFamily:D.mono,fontSize:9,letterSpacing:'0.18em',textTransform:'uppercase',fontWeight:600}}>▲ +32%</div>

        <div style={{fontFamily:D.mono,fontSize:10,color:D.saffron,letterSpacing:'0.22em',textTransform:'uppercase',fontWeight:700}}>September Earnings</div>
        <div style={{fontFamily:D.serif,fontSize:44,color:D.cream,lineHeight:1,marginTop:8}}>₹<CountUp from={0} to={84500} t={clamp(localTime/2,0,1)}/></div>
        <div style={{fontFamily:D.sans,fontSize:12,color:D.creamDim,marginTop:8}}>↑ ₹20,400 vs. last month</div>
      </div>
      <div style={{marginTop:14,padding:16,borderRadius:14,background:'rgba(244,228,193,0.04)',border:'1px solid rgba(244,228,193,0.10)',opacity:clamp((localTime-0.3)/0.5,0,1)}}>
        <div style={{fontFamily:D.serif,fontSize:13,color:D.cream}}>Daily sales · 30 days</div>
        <svg width="100%" height="80" viewBox="0 0 320 80" style={{marginTop:6}}>
          {last&&<>
            <path d={d+` L${last[0]},80 L0,80 Z`} fill={D.saffron} opacity="0.18"/>
            <path d={d} stroke={D.saffron} strokeWidth="2.5" fill="none" strokeLinejoin="round" strokeLinecap="round"/>
            <circle cx={last[0]} cy={last[1]} r="4" fill={D.cream} stroke={D.saffron} strokeWidth="2"/>
          </>}
        </svg>
      </div>
      <div style={{marginTop:14,padding:'14px 16px',borderRadius:14,background:'rgba(126,201,138,0.10)',border:'1px solid rgba(126,201,138,0.32)',opacity:clamp((localTime-1.4)/0.5,0,1),transform:`translateY(${(1-clamp((localTime-1.4)/0.5,0,1))*12}px)`}}>
        <div style={{fontFamily:D.mono,fontSize:9,color:D.green,letterSpacing:'0.22em',textTransform:'uppercase',fontWeight:700,marginBottom:4}}>✓ Diwali week</div>
        <div style={{fontFamily:D.serif,fontSize:14,color:D.cream,lineHeight:1.4}}>Zero stock-outs.<br/><span style={{color:D.green}}>Mithai sold out in 4 days.</span></div>
      </div>
      <div style={{flex:1}}/>
      <div style={{display:'flex',justifyContent:'space-around',gap:6,padding:'10px 0',borderTop:'1px solid rgba(244,228,193,0.08)'}}>

      </div>
    </div>
  );
}

      <div style={{fontFamily:D.mono,fontSize:10,color:accent,letterSpacing:'0.22em',textTransform:'uppercase',fontWeight:700}}>◆ {hi}</div>

// ─── TIMESTAMP LABEL ─────────────────────────────────────────────
function TimestampLabel(){
  const t=useTime();
  React.useEffect(()=>{
    const s=Math.floor(t);
    const root=document.getElementById('root');
    if(root)root.setAttribute('data-screen-label',`${String(s).padStart(2,'0')}s`);
  },[Math.floor(t)]);
  return null;
}

function App(){
  return (
    <Stage width={1920} height={1080} duration={34} background="#140b06" loop persistKey="dukhaan-hero">

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
